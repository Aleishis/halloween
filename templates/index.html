<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monsters</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Halloween Monsters</h1>

        <form action="/monster" method="post">
            <label>Nombre <input type="text" name="name" required></label>
            <label>Poder <input type="text" name="power" required></label>
            <button type="submit">Agregar</button>
        </form>

        <table>
            <tr>
                <th>Nombre</th>
                <th>Poder</th>
            </tr>
            {% for monster in monsters %}
            <tr>
                <td>{{ monster.name }}</td>
                <td>{{ monster.power }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

    {% if added %}
    <script>
        for (let i = 0; i < 100; i++) {
            const bat = document.createElement('span');
            bat.className = 'bat';
            bat.textContent = '🦇';
            bat.style.left = Math.random() * 100 + 'vw';
            bat.style.fontSize = 20 + Math.random() * 30 + 'px';
            bat.style.setProperty('--drift', (Math.random() * 40 - 20) + 'vw');
            bat.style.animationDuration = 0.8 + Math.random() * 1.2 + 's';
            bat.style.animationDelay = Math.random() * 0.8 + 's';
            bat.addEventListener('animationend', () => bat.remove());
            document.body.appendChild(bat);
        }
        history.replaceState(null, '', '/');
    </script>
    {% endif %}
</body>
</html>
